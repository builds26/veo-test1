<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veo Test · builds26</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #161616; --border: #2a2a2a;
    --text: #f0f0f0; --muted: #888; --accent: #3b82f6;
    --accent-hover: #2563eb; --error: #ef4444; --success: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px; margin: 0 auto; padding: 24px 20px 80px;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; }
  .badge { font-size: 12px; color: var(--muted); background: var(--panel); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 110px; padding: 12px; font-size: 16px;
    font-family: inherit; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  select {
    flex: 1; min-width: 140px; padding: 10px 12px; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  button {
    padding: 12px 24px; font-size: 16px; font-weight: 600; background: var(--accent);
    color: white; border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  .status { display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
  .status.show { display: block; }
  .status.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); }
  .status.success { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); }
  video { width: 100%; margin-top: 16px; border-radius: 8px; background: black; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .preset {
    padding: 6px 12px; font-size: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 16px; cursor: pointer; color: var(--muted);
  }
  .footer-note { font-size: 12px; color: var(--muted); margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>

<header>
  <h1>🎬 Veo Test</h1>
  <span class="badge">builds26</span>
</header>

<div class="panel">
  <label for="prompt">Prompt</label>
  <textarea id="prompt" placeholder="A baby in a pinstripe business suit slams fist on desk..."></textarea>

  <div class="presets">
    <span class="preset" data-preset="anchor">📺 News anchor</span>
    <span class="preset" data-preset="baby">👶 Baby exec</span>
    <span class="preset" data-preset="brit">🇬🇧 British street</span>
    <span class="preset" data-preset="dog">🐕 Office dog</span>
    <span class="preset" data-preset="aviation">✈️ Plane spotter</span>
  </div>

  <div class="row">
    <select id="model">
      <option value="veo3_fast">Veo 3.1 Fast (60 cr, ~60s)</option>
      <option value="veo3">Veo 3.1 Quality (250 cr, ~3min)</option>
    </select>
    <select id="aspectRatio">
      <option value="16:9">16:9 landscape</option>
      <option value="9:16">9:16 vertical</option>
    </select>
  </div>

  <div class="row">
    <button id="generateBtn">Generate</button>
  </div>

  <div class="footer-note">API: <span id="apiUrl">not set</span></div>
</div>

<div id="status" class="status"></div>
<video id="video" controls style="display:none;"></video>

<script>
const API_BASE = "https://veo-test1.onrender.com";

const PRESETS = {
  anchor: "A serious news anchor in a navy suit at a professional news desk reports breaking news with complete sincerity: 'Scientists have confirmed that pigeons are just government drones running low on battery.' Lower-third graphics, studio lighting, deadpan delivery.",
  baby: "A baby in a pinstripe business suit sits behind a CEO desk, slams fist down, says angrily: 'We are NOT meeting Q3 targets, Janet.' Corporate office, dramatic lighting, close-up.",
  brit: "A man in a tracksuit standing outside a Greggs at 8am eating a flaky golden cylindrical sausage roll pastry, looks directly at camera, says deadpan: 'This is my Roman Empire.' Manchester high street, grey overcast sky, British accent.",
  dog: "A golden retriever wearing reading glasses sits at a desk reviewing spreadsheets, sighs heavily, takes a sip from a coffee mug. Modern office, soft window lighting.",
  aviation: "A plane spotter with a long lens camera at an airport fence suddenly gets excited, says to camera: 'She is coming in HOT today, lads — 47 knot crosswind, watch this.' Runway visible in background, windy day, Manchester airport."
};

const promptEl = document.getElementById("prompt");
const modelEl = document.getElementById("model");
const aspectEl = document.getElementById("aspectRatio");
const btn = document.getElementById("generateBtn");
const statusEl = document.getElementById("status");
const videoEl = document.getElementById("video");
document.getElementById("apiUrl").textContent = API_BASE;

document.querySelectorAll(".preset").forEach(el => {
  el.addEventListener("click", () => {
    promptEl.value = PRESETS[el.dataset.preset] || "";
    promptEl.focus();
  });
});

btn.addEventListener("click", generate);

function setStatus(msg, type = "") {
  statusEl.className = "status show " + type;
  statusEl.textContent = msg;
}

async function generate() {
  const prompt = promptEl.value.trim();
  if (!prompt) { setStatus("Enter a prompt first.", "error"); return; }

  btn.disabled = true;
  btn.textContent = "Submitting...";
  videoEl.style.display = "none";
  setStatus("Submitting to Veo...");

  try {
    const res = await fetch(`${API_BASE}/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, model: modelEl.value, aspect_ratio: aspectEl.value }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    const taskId = data?.data?.taskId || data?.taskId || data?.task_id;
    if (!taskId) throw new Error("No taskId: " + JSON.stringify(data));
    setStatus(`Job ${taskId} submitted. Polling...`);
    btn.textContent = "Generating...";
    pollStatus(taskId);
  } catch (e) {
    setStatus("Error: " + e.message, "error");
    btn.disabled = false;
    btn.textContent = "Generate";
  }
}

function pollStatus(taskId) {
  const startTime = Date.now();
  const interval = setInterval(async () => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    if (elapsed > 300) {
      clearInterval(interval);
      setStatus(`Timed out after 5 min.`, "error");
      btn.disabled = false; btn.textContent = "Generate"; return;
    }
    try {
      const res = await fetch(`${API_BASE}/status/${taskId}`);
      if (!res.ok) return;
      const data = await res.json();
      const info = data?.data || data;
      const videoUrl = info?.response?.resultUrls?.[0] || info?.resultUrls?.[0] || info?.videoUrl || info?.video_url;
      const jobStatus = info?.status || info?.state || "processing";
      setStatus(`Status: ${jobStatus} · ${elapsed}s`);
      if (videoUrl) {
        clearInterval(interval);
        setStatus(`✅ Done in ${elapsed}s`, "success");
        videoEl.src = videoUrl;
        videoEl.style.display = "block";
        btn.disabled = false; btn.textContent = "Generate";
      } else if (jobStatus === "failed" || jobStatus === "error") {
        clearInterval(interval);
        setStatus(`Job failed: ${JSON.stringify(info)}`, "error");
        btn.disabled = false; btn.textContent = "Generate";
      }
    } catch (e) { console.warn("Poll error:", e); }
  }, 5000);
}
</script>
</body>
</html>
