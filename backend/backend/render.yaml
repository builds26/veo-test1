services:
  - type: web
    name: veo-test-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: KIE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
